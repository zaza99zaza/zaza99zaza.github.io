<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Perestrojka Fest 2025</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=D-DIN+Condensed:wght@300;400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'D-DIN Condensed', sans-serif;

      /* 🔻 NUOVO SFONDO PNG */
      background: url('background.png') no-repeat center center;
      background-size: cover;

      /* Ottimizzato per telefono */
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;

      color: black;
      text-align: center;
    }

    .download-link {
      margin-bottom: 3rem;
      font-size: 1.6rem;
      font-weight: 700;
      text-decoration: underline;
      color: black;
    }

    @media (max-width: 600px) {
      .download-link {
        font-size: 1.4rem;
      }
    }
  </style>

  <script>
    // 🔻 Download automatico
    window.onload = function() {
      const link = document.createElement('a');
      link.href = 'manifesto_perestrojka.pdf';
      link.download = 'manifesto_perestrojka.pdf';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };
  </script>
</head>

<body>
  <a class="download-link" href="manifesto_perestrojka.pdf" download>
    Se il download non è partito automaticamente, clicca qui per scaricare il manifesto.
  </a>
</body>
</html>
